name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: creator_os_testing
      DB_USERNAME: vyra_ci
      DB_PASSWORD: vyra_ci_password

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: creator_os_testing
          POSTGRES_USER: vyra_ci
          POSTGRES_PASSWORD: vyra_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vyra_ci -d creator_os_testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if php -r 'new PDO("pgsql:host=".getenv("DB_HOST").";port=".getenv("DB_PORT").";dbname=".getenv("DB_DATABASE"), getenv("DB_USERNAME"), getenv("DB_PASSWORD"));'; then
              exit 0
            fi

            sleep 1
          done

          exit 1

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
